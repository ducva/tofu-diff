name: CI and release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

  release:
    name: Build and release
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist build
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${targets[@]}"; do
            IFS=/ read -r goos goarch <<< "$target"
            build_dir="build/${goos}-${goarch}"
            binary="tofu-diff"
            if [[ "$goos" == "windows" ]]; then
              binary="${binary}.exe"
            fi

            mkdir -p "$build_dir"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$build_dir/$binary" ./cmd/tofu-diff

            archive="tofu-diff_${goos}_${goarch}"
            if [[ "$goos" == "windows" ]]; then
              (cd "$build_dir" && zip -q "../../dist/${archive}.zip" "$binary")
            else
              tar -C "$build_dir" -czf "dist/${archive}.tar.gz" "$binary"
            fi
          done

          (cd dist && sha256sum tofu-diff_* > checksums.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v0.0.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "tofu-diff $tag" \
              --generate-notes \
              --latest
          fi
